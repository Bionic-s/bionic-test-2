# Bionic Solutions — Nginx Production (bionics.sa)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 50M;
    access_log /app/logs/nginx_access.log;
    error_log /app/logs/nginx_error.log;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location /api { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /health { proxy_pass http://127.0.0.1:8000; }
    location /docs { proxy_pass http://127.0.0.1:8000; }
    location /openapi.json { proxy_pass http://127.0.0.1:8000; }
    location /output { alias /app/output; }
    location /uploads { alias /app/uploads; }
    location /api/send-guide { proxy_pass http://172.18.0.1:8899; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /claw/ {
        rewrite ^/claw/(.*)$ /$1 break;
        proxy_pass http://172.18.0.1:18789;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_redirect http:// https://;
    }
    location = /test-site-2 {
        return 301 /test-site-2/;
    }
    location /test-site/ {
        alias /app/test-site/;
        try_files $uri /test-site/index.html;
    }
    # Hashed build assets: cache forever
    location ^~ /test-site-2/assets/ {
        alias /app/test-site-2/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /test-site-2/ {
        alias /app/test-site-2/;
        try_files $uri /test-site-2/index.html;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://krjgjaemysvutpwbwgst.supabase.co https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com; frame-src https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }
    location / { root /app/frontend/dist; try_files $uri /index.html; expires 5m; add_header Cache-Control "public"; }
}