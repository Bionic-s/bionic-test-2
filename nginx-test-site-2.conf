# Nginx redirect snippet for Bionic Solutions test-site-2
# Place in server block for app.bionics.sa
#
# Redirect /test-site-2 (no trailing slash) → /test-site-2/
location = /test-site-2 {
    return 301 /test-site-2/;
}

# Ensure /test-site-2/ index serves the SPA
location /test-site-2/ {
    alias /usr/share/nginx/html/test-site-2/;
    try_files $uri $uri/ /test-site-2/index.html;
    expires 7d;
    add_header Cache-Control "public, immutable";
}
