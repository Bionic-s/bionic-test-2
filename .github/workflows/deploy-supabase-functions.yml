name: Deploy Supabase Edge Functions

# Deploys every function in supabase/functions/ automatically whenever a
# push touches them — no manual `supabase functions deploy` ever again.
# One-time setup: add the SUPABASE_ACCESS_TOKEN repository secret
# (GitHub → Settings → Secrets and variables → Actions).
on:
  push:
    branches: [audit-fixes, main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        run: supabase functions deploy --project-ref krjgjaemysvutpwbwgst
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
